<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/><stop offset="1" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="eq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(1) translate(-256 -256)" font-family="DejaVu Sans" font-weight="bold">
    <g transform="rotate(-10 160 268)" filter="url(#shadow)">
      <rect x="70" y="148" width="180" height="240" rx="30" fill="#ffffff"/>
      <text x="160" y="302" font-size="96" text-anchor="middle" fill="#1e1b4b">15</text>
    </g>
    <g transform="rotate(9 352 248)" filter="url(#shadow)">
      <rect x="262" y="128" width="180" height="240" rx="30" fill="url(#eq)"/>
      <text x="405" y="230" font-size="72" text-anchor="end" fill="#ffffff">7</text>
      <text x="405" y="304" font-size="72" text-anchor="end" fill="#ffffff">+ 8</text>
      <rect x="300" y="322" width="108" height="9" rx="4" fill="#ffffff"/>
    </g>
  </g>
</svg>
